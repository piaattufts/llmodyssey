<text x="96" y="290" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">Base44-hosted proof</text>
<text x="96" y="342" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">of concept</text>
<text x="96" y="394" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start"></text>
<text x="96" y="446" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">Games, guides,</text>
<text x="96" y="498" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">and feedback</text>
<text x="96" y="550" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start"></text>
<text x="96" y="602" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">Platform account</text>
<text x="96" y="654" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="650" fill="#142033" text-anchor="start">and entity store</text>
<line x1="620" y1="520" x2="700" y2="520" stroke="#142033" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="710" y="140" width="500" height="780" rx="20" fill="#E7F1FB" stroke="#1B4F8A" stroke-width="5"/>
