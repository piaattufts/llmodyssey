  <rect width="1920" height="1080" fill="#F4F7FB"/>
  <text x="72" y="68" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="48" font-weight="800" fill="#142033" text-anchor="start">From prototype to public platform</text>
