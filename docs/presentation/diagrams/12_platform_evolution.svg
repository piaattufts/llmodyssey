<text x="742" y="300" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">Preserve</text>
<text x="742" y="352" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">content</text>
<text x="742" y="404" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">concepts</text>
<text x="742" y="456" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">pedagogy</text>
<text x="742" y="508" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start"></text>
<text x="742" y="560" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">Replace</text>
<text x="742" y="612" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">required backend</text>
<text x="742" y="664" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">and platform lock-in</text>
<line x1="1226" y1="520" x2="1306" y2="520" stroke="#142033" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1316" y="140" width="540" height="780" rx="20" fill="#FFF4D8" stroke="#8A5A12" stroke-width="5"/>
<text x="1348" y="210" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#8A5A12" text-anchor="start">PUBLIC PLATFORM</text>
<text x="1348" y="290" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">React + TypeScript</text>
<text x="1348" y="342" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">Local-first</text>
<text x="1348" y="394" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">GitHub Pages</text>
<text x="1348" y="446" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">Educator reusable</text>
<text x="1348" y="498" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">No paid API</text>
<text x="1348" y="550" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start"></text>
<text x="1348" y="602" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">Token Forge is the</text>
<text x="1348" y="654" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#142033" text-anchor="start">reference game</text>
<rect x="64" y="980" width="1792" height="68" rx="16" fill="#FFFFFF" stroke="#142033" stroke-width="4"/>
<text x="960" y="1024" font-family="Noto Sans, Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#142033" text-anchor="middle">Product evolution.  The prototype supplied the curriculum.  This release stands alone.</text>
